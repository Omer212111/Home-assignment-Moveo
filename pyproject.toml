[project]
name = "weather-risk-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
