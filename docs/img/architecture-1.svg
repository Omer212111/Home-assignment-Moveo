<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 750" width="1290" height="750" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>System architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c06a12"/>
    </marker>
  </defs>
  <style>
    .t   { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .s   { font-size: 11px; text-anchor: middle; }
    .lbl { font-size: 11px; fill: #555; }
    .grp { font-size: 12px; font-weight: 600; fill: #555; }
    .e   { fill: none; stroke: #555; stroke-width: 1.4; marker-end: url(#arrow); }
    .eL  { fill: none; stroke: #c06a12; stroke-width: 1.6; marker-end: url(#arrowLoop); }
    .client { fill: #f3eefa; stroke: #7d5bb5; }  .client-t { fill: #271a3b; }
    .api    { fill: #e8f1fb; stroke: #3b78c3; }  .api-t    { fill: #13263d; }
    .agent  { fill: #fff4e5; stroke: #d9822b; }  .agent-t  { fill: #3d2a12; }
    .ext    { fill: #fdecec; stroke: #c0504d; }  .ext-t    { fill: #3b1414; }
    .eng    { fill: #eaf6ec; stroke: #3c9a52; }  .eng-t    { fill: #14301b; }
  </style>

  <rect width="1290" height="750" fill="#ffffff"/>

  <!-- ===== containers ===== -->
  <rect x="240" y="110" width="845" height="620" rx="10" fill="#fafafa" stroke="#c8c8c8"/>
  <text class="grp" x="1069" y="134" text-anchor="end">FastAPI service · Docker on Render · one process</text>

  <rect x="450" y="170" width="380" height="330" rx="10" fill="#fffaf2" stroke="#d9822b" stroke-dasharray="5 4"/>
  <text class="grp" x="814" y="488" text-anchor="end" style="fill:#c06a12">Agent loop · ≤ 2 tool rounds · ≤ 6 Claude calls</text>

  <!-- ===== external: chat page ===== -->
  <rect class="client" x="20" y="205" width="150" height="80" rx="8"/>
  <text class="t client-t" x="95" y="232">Chat page</text>
  <text class="s client-t" x="95" y="250">browser (HTML/JS)</text>
  <text class="s client-t" x="95" y="266">answer + agent steps</text>

  <!-- ===== external: snapshot (cylinder) ===== -->
  <path class="eng" d="M20,540 v50 a75,10 0 0 0 150,0 v-50"/>
  <ellipse class="eng" cx="95" cy="540" rx="75" ry="10"/>
  <text class="t eng-t" x="95" y="564">Parquet snapshot</text>
  <text class="s eng-t" x="95" y="580">weather + FEMA data</text>
  <text class="s eng-t" x="95" y="595">loaded at startup</text>

  <!-- ===== external: Claude ===== -->
  <rect class="ext" x="475" y="20" width="170" height="56" rx="8"/>
  <text class="t ext-t" x="560" y="43">Anthropic API</text>
  <text class="s ext-t" x="560" y="61">Claude Sonnet 5.5</text>

  <!-- ===== external: webhook ===== -->
  <rect class="ext" x="1120" y="640" width="150" height="60" rx="8"/>
  <text class="t ext-t" x="1195" y="665">Webhook</text>
  <text class="s ext-t" x="1195" y="683">Slack-compatible</text>

  <!-- ===== API endpoints ===== -->
  <rect class="api" x="270" y="213" width="140" height="60" rx="8"/>
  <text class="t api-t" x="340" y="238">POST /chat</text>
  <text class="s api-t" x="340" y="256">{message, session_id}</text>

  <rect class="api" x="870" y="200" width="180" height="60" rx="8"/>
  <text class="t api-t" x="960" y="225">GET /rankings, /hubs</text>
  <text class="s api-t" x="960" y="243">direct API · no LLM</text>

  <!-- ===== agent loop ===== -->
  <rect class="agent" x="475" y="211" width="170" height="64" rx="8"/>
  <text class="t agent-t" x="560" y="232">Call Claude</text>
  <text class="s agent-t" x="560" y="249">question + chat history</text>
  <text class="s agent-t" x="560" y="264">+ 5 tool schemas</text>

  <polygon class="agent" points="490,342 560,310 630,342 560,374"/>
  <text class="s agent-t" x="560" y="346" font-weight="600">Claude's reply?</text>

  <rect class="agent" x="690" y="312" width="125" height="60" rx="8"/>
  <text class="t agent-t" x="752" y="337">Run tools</text>
  <text class="s agent-t" x="752" y="355">validate args</text>

  <rect class="agent" x="475" y="410" width="170" height="56" rx="8"/>
  <text class="t agent-t" x="560" y="433">Check final answer</text>
  <text class="s agent-t" x="560" y="451">ModelAnswer JSON</text>

  <!-- ===== tools, scoring, storage, alerts ===== -->
  <rect class="agent" x="870" y="304" width="180" height="76" rx="8"/>
  <text class="t agent-t" x="960" y="325">5 tools</text>
  <text class="s agent-t" x="960" y="342">rank_hubs · explain_hub</text>
  <text class="s agent-t" x="960" y="357">compare_hubs · hub_breakdown</text>
  <text class="s agent-t" x="960" y="372">weather_stat</text>

  <rect class="eng" x="870" y="530" width="180" height="70" rx="8"/>
  <text class="t eng-t" x="960" y="554">Scoring service</text>
  <text class="s eng-t" x="960" y="572">disruption scores per hub</text>
  <text class="s eng-t" x="960" y="587">cached in memory</text>

  <path class="eng" d="M270,540 v50 a70,10 0 0 0 140,0 v-50"/>
  <ellipse class="eng" cx="340" cy="540" rx="70" ry="10"/>
  <text class="t eng-t" x="340" y="568">SQLite</text>
  <text class="s eng-t" x="340" y="584">scores · chats · alerts</text>

  <rect class="agent" x="870" y="640" width="180" height="60" rx="8"/>
  <text class="t agent-t" x="960" y="664">Alerts job · every 60 s</text>
  <text class="s agent-t" x="960" y="682">outlook · score change</text>

  <!-- ===== edges: browser <-> /chat ===== -->
  <path class="e" d="M170,233 H268"/>
  <text class="lbl" x="205" y="225" text-anchor="middle">question</text>
  <path class="e" d="M270,255 H172"/>
  <text class="lbl" x="205" y="271" text-anchor="middle">answer</text>

  <!-- /chat -> loop, loop -> /chat -->
  <path class="e" d="M410,243 H473"/>
  <path class="e" d="M475,438 H380 V275"/>
  <text class="lbl" x="388" y="360">answer</text>

  <!-- /chat <-> SQLite (history) -->
  <path class="e" d="M300,275 V528" stroke-dasharray="4 3" marker-start="url(#arrow)"/>
  <text class="lbl" x="292" y="400" text-anchor="end">history</text>

  <!-- Claude <-> Call Claude -->
  <path class="e" d="M560,209 V78" marker-start="url(#arrow)"/>
  <text class="lbl" x="568" y="97">Messages API</text>

  <!-- the loop -->
  <path class="eL" d="M560,275 V308"/>
  <path class="eL" d="M630,342 H688"/>
  <text class="lbl" x="660" y="334" text-anchor="middle" style="fill:#c06a12">tool_use</text>
  <path class="eL" d="M752,312 V243 H647"/>
  <text class="lbl" x="698" y="235" text-anchor="middle" style="fill:#c06a12">tool results</text>
  <path class="eL" d="M560,374 V408"/>
  <text class="lbl" x="568" y="396" style="fill:#c06a12">final answer</text>

  <!-- tools -> scoring -->
  <path class="e" d="M815,342 H868"/>
  <path class="e" d="M960,380 V528"/>

  <!-- REST -> scoring (routed on the right) -->
  <path class="e" d="M1050,230 H1066 V565 H1052"/>

  <!-- snapshot -> SQLite, SQLite -> scoring -->
  <path class="e" d="M170,565 H268"/>
  <path class="e" d="M410,565 H868"/>
  <text class="lbl" x="640" y="557" text-anchor="middle">active scoring run</text>

  <!-- scoring -> alerts, alerts <-> SQLite, alerts -> webhook -->
  <path class="e" d="M960,600 V638"/>
  <path class="e" d="M870,670 H340 V603" marker-start="url(#arrow)"/>
  <text class="lbl" x="605" y="662" text-anchor="middle">alerts outbox</text>
  <path class="e" d="M1050,670 H1118"/>
  <text class="lbl" x="1102" y="662" text-anchor="middle">POST</text>
</svg>
